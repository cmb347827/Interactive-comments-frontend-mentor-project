
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <meta name="description"  content="Interactive comments app" />
 
  <link  href="./src/headstyles.css" rel="stylesheet" type='text/css'>
  <title>Frontend Mentor | Interactive comments section</title>

  
</head>
<body class="darker-white-background">
      <main id="main" class="darker-white-background">
          <h1 class="visually-hidden">All user comments:</h1>
          <section id='testing' class='js-comments grid-container'>
            <!-- Pull dynamic content from the data.json file -->
             
          </section>
          <dialog class="js-dialog">
              <h2>Delete comment</h2>
              <p>Are you sure you want to delete this comment? This will remove the comment and cannot be undone</p>
              <form method="post" class="display-flex justify-content-space-between">
                <button type='button' class="js-cancel text-uppercase white-font ">No,cancel</button>
                <button type='submit' class="js-yes text-uppercase white-font">Yes,delete</button>
                
              </form>
          </dialog>
      </main>
      <footer class="display-flex justify-content-center">
          <div>
            <span class=''>Challenge by</span><address><a class='' href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a></address>
            <span class=''>Coded by</span><address><a href="https://www.frontendmentor.io/profile/cmb347827">CMB</a></address>
          </div>
      </footer>	
      <link  href="./src/style.css" rel="stylesheet" type='text/css'>
      <script type="module" src="./src/main.js"></script>
      
</body>
</html>
